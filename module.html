<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сводка по направлению — Business Financial OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap">
<style>
  :root {
    --ink-950:#050504; --ink-900:#0c0a08; --ink-800:#1a1512; --ink-700:#2a221c;
    --ink-500:#5c4e42; --ink-400:#8c8178; --ink-300:#a89c8f; --ink-200:#cabfb3; --ink-100:#e8e0d6; --ink-50:#faf6f1;
    --brand-500:#ff8a3d; --brand-600:#e8622a; --brand-700:#b84a1a;
    --positive:#0ca30c; --warning:#fab219; --negative:#d03b3b;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter', sans-serif; background:var(--ink-950); color:var(--ink-50); min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:960px; margin:0 auto; padding:0 24px 80px; }

  header { display:flex; align-items:center; justify-content:space-between; padding:28px 0; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:8px; flex-wrap:wrap; gap:16px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; }
  .brand-mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--brand-500),var(--brand-700)); display:flex; align-items:center; justify-content:center; flex:none; }
  .back { font-size:13.5px; font-weight:600; color:var(--ink-300); display:flex; align-items:center; gap:6px; transition:color .2s ease; }
  .back:hover { color:var(--brand-500); }

  .mod-head { display:flex; align-items:flex-start; gap:18px; padding:36px 0 8px; flex-wrap:wrap; }
  .mod-icon-big { width:56px; height:56px; border-radius:16px; background:var(--brand-500); display:flex; align-items:center; justify-content:center; flex:none; }
  .mod-head h1 { font-family:'Manrope',sans-serif; font-weight:800; font-size:clamp(24px,3.4vw,34px); }
  .mod-head .company { color:var(--ink-300); font-size:14.5px; margin-top:6px; }
  .health-badge { margin-top:12px; display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; padding:6px 14px; border-radius:999px; }
  .health-badge.bad { color:var(--negative); background:rgba(208,59,59,.12); border:1px solid rgba(208,59,59,.35); }
  .health-badge.warn { color:var(--warning); background:rgba(250,178,25,.12); border:1px solid rgba(250,178,25,.35); }
  .health-badge.ok { color:var(--positive); background:rgba(12,163,12,.12); border:1px solid rgba(12,163,12,.35); }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:32px 0; }
  .stat { background:var(--ink-900); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:18px; }
  .stat .label { font-size:11.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.4px; line-height:1.3; }
  .stat .value { font-family:'Manrope',sans-serif; font-size:21px; font-weight:700; margin-top:8px; }
  .stat .value.ok { color:var(--positive); }
  .stat .value.warn { color:var(--warning); }
  .stat .value.bad { color:var(--negative); }

  .section-title { font-family:'Manrope',sans-serif; font-size:18px; font-weight:700; margin:40px 0 16px; display:flex; align-items:center; gap:10px; }
  .section-title .count { font-size:12px; font-weight:700; color:var(--ink-900); background:var(--brand-500); border-radius:999px; padding:2px 10px; }

  .item { background:var(--ink-900); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  .item-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .sev-badge { font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:3px 10px; border-radius:999px; }
  .sev-badge.critical { color:var(--negative); background:rgba(208,59,59,.14); border:1px solid rgba(208,59,59,.4); }
  .sev-badge.warning { color:var(--warning); background:rgba(250,178,25,.14); border:1px solid rgba(250,178,25,.4); }
  .sev-badge.opportunity { color:var(--positive); background:rgba(12,163,12,.14); border:1px solid rgba(12,163,12,.4); }
  .item h4 { font-family:'Manrope',sans-serif; font-size:15.5px; font-weight:700; }
  .item p { font-size:14px; color:var(--ink-200); line-height:1.55; }

  .actions-box { background:var(--ink-900); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:22px 24px; }
  .actions-box ol { padding-left:20px; }
  .actions-box li { font-size:14px; color:var(--ink-200); line-height:1.6; margin-bottom:10px; }
  .actions-box li::marker { color:var(--brand-500); font-weight:700; }

  .people-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .person { background:var(--ink-900); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:20px 22px; }
  .person-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .person-name { font-family:'Manrope',sans-serif; font-size:15.5px; font-weight:700; }
  .person-role { font-size:12.5px; color:var(--ink-400); margin-top:2px; }
  .person-status { font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .person-status.overloaded, .person-status.at_risk { color:var(--negative); background:rgba(208,59,59,.14); border:1px solid rgba(208,59,59,.4); }
  .person-status.watch { color:var(--warning); background:rgba(250,178,25,.14); border:1px solid rgba(250,178,25,.4); }
  .person-note { font-size:13.5px; color:var(--ink-200); line-height:1.5; margin-top:8px; }

  .cta-row { margin-top:44px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn-primary { display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:999px; font-size:14.5px; font-weight:600; background:var(--brand-500); color:#1a1512; transition:transform .2s ease, box-shadow .2s ease; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(255,138,61,.3); }
  .btn-secondary { display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:999px; font-size:14.5px; font-weight:600; border:1px solid rgba(255,255,255,.16); color:var(--ink-100); transition:border-color .2s ease, color .2s ease; }
  .btn-secondary:hover { border-color:var(--brand-500); color:var(--brand-500); }

  .disclaimer { margin-top:44px; padding:18px 22px; background:var(--ink-900); border:1px solid rgba(255,255,255,.08); border-radius:14px; font-size:13px; color:var(--ink-400); line-height:1.5; }

  .notfound { text-align:center; padding:100px 24px; color:var(--ink-400); }

  @media (max-width: 760px) { .stats { grid-template-columns:repeat(2,1fr); } .people-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M12 2.4 A9.6 9.6 0 1 1 3.68 7.2" stroke="#1a1512" stroke-width="2" stroke-linecap="round"/><path d="M3.68 7.2 L3.68 2.4 M3.68 7.2 L8.4 6" stroke="#1a1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      Business Financial OS
    </a>
    <a href="dashboard.html" class="back">← К общему дашборду</a>
  </header>

  <div id="content"></div>

  <div class="disclaimer" id="disclaimerBox" style="display:none">
    Показаны демо-данные — те же примеры, что уже работают в реальном продукте этого направления. Общая база данных между всеми шестью продуктами и живая синхронизация — следующий этап по дорожной карте, пока каждый продукт считает свои цифры самостоятельно.
  </div>
</div>

<script src="data.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var key = params.get('m');
  var m = MODULES_DATA[key];
  var content = document.getElementById('content');

  var SEV_LABEL = { critical:'Критично', warning:'Внимание', opportunity:'Возможность' };
  var STATUS_LABEL_CLASS = { overloaded:'overloaded', at_risk:'at_risk', watch:'watch' };

  if (!m) {
    content.innerHTML = '<div class="notfound">Направление не найдено. <a href="dashboard.html" style="color:var(--brand-500); font-weight:600;">← Вернуться к дашборду</a></div>';
  } else {
    document.title = m.name + ' — сводка — Business Financial OS';
    document.getElementById('disclaimerBox').style.display = 'block';

    var html = '';

    html += '<div class="mod-head">' +
      '<div class="mod-icon-big"><svg viewBox="0 0 24 24" width="30" height="30" fill="none">' + m.icon + '</svg></div>' +
      '<div><h1>' + m.name + '</h1>' +
      '<p class="company">Демо-компания: ' + m.company + '</p>' +
      '<span class="health-badge ' + m.healthClass + '">' + m.healthLabel + ' · ' + m.healthValue + '</span>' +
      '</div></div>';

    html += '<div class="stats">';
    m.stats.forEach(function(s){
      html += '<div class="stat"><div class="label">' + s.label + '</div><div class="value ' + s.cls + '">' + s.value + '</div></div>';
    });
    html += '</div>';

    html += '<div class="section-title">Задачи и рекомендации <span class="count">' + m.items.length + '</span></div>';
    m.items.forEach(function(it){
      html += '<div class="item">' +
        '<div class="item-head"><span class="sev-badge ' + it.severity + '">' + SEV_LABEL[it.severity] + '</span><h4>' + it.title + '</h4></div>' +
        '<p>' + it.body + '</p></div>';
    });

    if (m.actions && m.actions.length) {
      html += '<div class="section-title">Что делать прямо сейчас</div>';
      html += '<div class="actions-box"><ol>';
      m.actions.forEach(function(a){ html += '<li>' + a + '</li>'; });
      html += '</ol></div>';
    }

    if (m.people && m.people.length) {
      html += '<div class="section-title">Люди <span class="count">' + m.people.length + '</span></div>';
      html += '<div class="people-grid">';
      m.people.forEach(function(p){
        html += '<div class="person">' +
          '<div class="person-head"><div><div class="person-name">' + p.name + '</div><div class="person-role">' + p.role + '</div></div>' +
          '<span class="person-status ' + STATUS_LABEL_CLASS[p.status] + '">' + p.statusLabel + '</span></div>' +
          '<p class="person-note">' + p.note + '</p></div>';
      });
      html += '</div>';
    }

    html += '<div class="cta-row">' +
      '<a href="' + m.url + '" target="_blank" class="btn-primary">Открыть полный продукт →</a>' +
      '<a href="dashboard.html" class="btn-secondary">← К общему дашборду</a>' +
      '</div>';

    content.innerHTML = html;
  }
</script>
</body>
</html>
