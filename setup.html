<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор модулей — Business Financial OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap">
<style>
  :root {
    --ink-950:#050504; --ink-900:#0c0a08; --ink-800:#1a1512; --ink-700:#2a221c;
    --ink-500:#5c4e42; --ink-400:#8c8178; --ink-300:#a89c8f; --ink-200:#cabfb3; --ink-100:#e8e0d6; --ink-50:#faf6f1;
    --brand-500:#ff8a3d; --brand-600:#e8622a; --brand-700:#b84a1a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter', sans-serif; background:var(--ink-950); color:var(--ink-50); min-height:100vh; }
  a { color:inherit; }
  .wrap { max-width:920px; margin:0 auto; padding:64px 24px 96px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; margin-bottom:48px; }
  .brand-mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--brand-500),var(--brand-700)); display:flex; align-items:center; justify-content:center; flex:none; }
  .eyebrow { font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--brand-500); }
  h1 { font-family:'Manrope',sans-serif; font-weight:800; font-size:clamp(28px,4vw,42px); margin-top:12px; }
  .lead { color:var(--ink-300); font-size:16px; margin-top:14px; max-width:560px; line-height:1.5; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:40px; }
  .mod { position:relative; cursor:pointer; background:var(--ink-900); border:2px solid rgba(255,255,255,.1); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:10px; transition:border-color .2s ease, background .2s ease, transform .2s ease; user-select:none; }
  .mod:hover { transform:translateY(-3px); }
  .mod.active { border-color:var(--brand-500); background:var(--ink-800); }
  .mod-icon { width:40px; height:40px; border-radius:11px; background:var(--brand-500); display:flex; align-items:center; justify-content:center; flex:none; }
  .mod h3 { font-family:'Manrope',sans-serif; font-size:16px; font-weight:700; }
  .mod p { font-size:13px; color:var(--ink-300); line-height:1.4; }
  .check { position:absolute; top:16px; right:16px; width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; transition:all .2s ease; }
  .mod.active .check { background:var(--brand-500); border-color:var(--brand-500); }
  .check svg { opacity:0; transition:opacity .15s ease; }
  .mod.active .check svg { opacity:1; }

  .actions { display:flex; align-items:center; justify-content:space-between; margin-top:40px; flex-wrap:wrap; gap:16px; }
  .hint { font-size:13.5px; color:var(--ink-400); }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 28px; border-radius:999px; font-size:15px; font-weight:600; background:var(--brand-500); color:#1a1512; border:none; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(255,138,61,.35); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

  @media (max-width: 760px) { .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width: 480px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M12 2.4 A9.6 9.6 0 1 1 3.68 7.2" stroke="#1a1512" stroke-width="2" stroke-linecap="round"/><path d="M3.68 7.2 L3.68 2.4 M3.68 7.2 L8.4 6" stroke="#1a1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    Business Financial OS
  </a>

  <p class="eyebrow">Настройка компании</p>
  <h1>Какие направления вам нужны?</h1>
  <p class="lead">Выберите модули — общий дашборд соберёт на одном экране только то, что вы включили. Можно изменить выбор в любой момент.</p>

  <div class="grid" id="modGrid"></div>

  <div class="actions">
    <p class="hint" id="hint">Выбрано модулей: 6 из 6</p>
    <button class="btn" id="goBtn">Открыть общий дашборд →</button>
  </div>
</div>

<script>
  var MODULES = [
    { key:'finance', name:'Business Financial OS', desc:'Финансы: P&L, Cash Flow, прогноз', icon:'<path d="M12 2.4 A9.6 9.6 0 1 1 3.68 7.2" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round"/><path d="M3.68 7.2 L3.68 2.4 M3.68 7.2 L8.4 6" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    { key:'marketing', name:'AI CMO', desc:'Маркетинг: каналы, бюджеты, ROMI', icon:'<path d="M12 2.4 A9.6 9.6 0 1 1 3.68 7.2" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round"/><path d="M7 15.5 L10.2 11.8 L13 14.2 L17.3 9.4" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    { key:'sales', name:'AI РОП', desc:'Продажи: воронка, менеджеры', icon:'<path d="M3 4 H21 L14 12.5 V18.5 L10 20.5 V12.5 L3 4 Z" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    { key:'ops', name:'AI COO', desc:'Операции: склад, поставки', icon:'<path d="M12 3 L20 7 V17 L12 21 L4 17 V7 Z" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 7 L12 11 L20 7" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    { key:'legal', name:'AI Legal', desc:'Юрист: договоры, риски', icon:'<path d="M12 2 V21 M5 7 L2.5 12.5 a3.2 3.2 0 0 0 6.4 0 L6.3 7 Z M18.3 7 L15.8 12.5 a3.2 3.2 0 0 0 6.4 0 L19.7 7 Z M12 2 L5 7 M12 2 L18.3 7 M7 21 H17" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    { key:'hr', name:'AI HR-партнёр', desc:'HR: отпуска, риск ухода', icon:'<circle cx="12" cy="7.5" r="3.4" stroke="#1a1512" stroke-width="1.8"/><path d="M4.5 20 V18.2 C4.5 14.8 7.8 12.3 12 12.3 C16.2 12.3 19.5 14.8 19.5 18.2 V20" stroke="#1a1512" stroke-width="1.8" stroke-linecap="round"/>' }
  ];

  var STORAGE_KEY = 'bfos_hub_modules_v1';
  var selected = {};
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    MODULES.forEach(function(m){ selected[m.key] = saved ? !!saved[m.key] : true; });
  } catch (e) {
    MODULES.forEach(function(m){ selected[m.key] = true; });
  }

  var grid = document.getElementById('modGrid');
  var hint = document.getElementById('hint');
  var goBtn = document.getElementById('goBtn');

  function render() {
    grid.innerHTML = '';
    MODULES.forEach(function(m) {
      var card = document.createElement('div');
      card.className = 'mod' + (selected[m.key] ? ' active' : '');
      card.innerHTML =
        '<div class="mod-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none">' + m.icon + '</svg></div>' +
        '<h3>' + m.name + '</h3>' +
        '<p>' + m.desc + '</p>' +
        '<div class="check"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><path d="M4 12l5 5L20 6" stroke="#1a1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      card.addEventListener('click', function(){
        selected[m.key] = !selected[m.key];
        render();
      });
      grid.appendChild(card);
    });
    var count = MODULES.filter(function(m){ return selected[m.key]; }).length;
    hint.textContent = 'Выбрано модулей: ' + count + ' из 6';
    goBtn.disabled = count === 0;
  }

  goBtn.addEventListener('click', function(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(selected));
    window.location.href = 'dashboard.html';
  });

  render();
</script>
</body>
</html>
